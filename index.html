<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <title>Impact List</title>
    <meta
      name="description"
      content="Impact List ranks the world's top donors by estimated lives saved through their donations — and lets you explore how the estimates change under your own assumptions."
    />
    <!-- %SITE_ORIGIN% is stamped at build time (see injectSiteOrigin in
         vite.config.js) — crawlers require absolute URLs here. -->
    <meta property="og:title" content="Impact List" />
    <meta
      property="og:description"
      content="Ranking the world's top donors by estimated lives saved through their donations."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Impact List" />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%SITE_ORIGIN%/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Impact List — ranking the world's top donors by lives saved" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_ORIGIN%/images/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
